[project]
name = "sentinel"
version = "0.1.0"
description = "Deterministic AI Tool Gateway for Closed-Box Legacy Systems"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.28,<2",
    "pydantic>=2.0",
    "structlog>=24.0",
    "httpx>=0.27,<0.28",
    "asyncvnc==1.3.0",
    "numpy==2.4.6",
    "pillow==12.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.8",
    "ruff>=0.2",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "layer1",
    "layer1.tn3270",
    "layer2",
    "layer2.tn3270",
    "layer3",
    "layer4",
    "drivers",
    "schemas",
    "services",
    "services.navigator",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["layer1/tests", "layer2/tests", "tests/unit", "tests/integration"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
