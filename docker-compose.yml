services:
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"   # Neo4j Browser UI
      - "7687:7687"   # Bolt protocol
    environment:
      NEO4J_AUTH: neo4j/sentinel_graph
      NEO4J_PLUGINS: '[]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  navigator:
    build:
      context: ./services/navigator
      dockerfile: Dockerfile
    ports:
      - "8100:8100"
    volumes:
      - ./services/navigator:/app/services/navigator
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: sentinel_graph
      NEO4J_DATABASE: neo4j
      NAVIGATOR_HOST: "0.0.0.0"
      NAVIGATOR_PORT: "8100"
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  logging-service:
    build:
      context: .
      dockerfile: services/logging_service/Dockerfile
    ports:
      - "127.0.0.1:8200:8200"
    environment:
      SENTINEL_LOG_DATABASE: /var/lib/sentinel-logging/observability.sqlite3
    volumes:
      - sentinel_logging_data:/var/lib/sentinel-logging
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8200/health', timeout=2); raise SystemExit(0 if response.status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 5
    restart: unless-stopped

  freedos:
    image: sivakuhan/freedos:latest
    container_name: sentinel-freedos
    ports:
      - "5900:5900"
      - "4444:4444"
    restart: unless-stopped

  mainframe:
    image: sivakuhan/tk5:v1.0
    container_name: tk5-hercules
    ports:
      - "3270:3270"
      - "8038:8038"
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  sentinel_logging_data:
